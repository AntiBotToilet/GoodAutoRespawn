# Мой тгк: t.me/@mgspl

# Задержка перед автореспавном в тиках (20 тиков = 1 секунда)
respawn-delay-ticks: 5

# Использовать кастомную точку возрождения
use-custom-spawn: false
spawn:
  world: spawn
  x: 0.0
  y: 64.0
  z: 0.0
  yaw: 0.0
  pitch: 0.0

# Настройки титула при возрождении
title:
  # Включить/выключить показ титула
  enabled: true
  # Время появления (в тиках)
  fade-in-ticks: 10
  # Время удержания на экране (в тиках)
  stay-ticks: 40
  # Время исчезновения (в тиках)
  fade-out-ticks: 10