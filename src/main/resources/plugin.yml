name: GoodAutoRespawn
version: 3.1
main: good.mc.AutoRespawn
api-version: 1.20
author: Goodmodn
description: Автоматически возрождает игрока после смерти.

commands:
  goodautorespawn:
    description: Управление плагином GoodAutoRespawn
    usage: /goodautorespawn reload
    permission: goodautorespawn.reload
    aliases: [gar, autorespawn]

permissions:
  goodautorespawn.reload:
    description: Позволяет перезагружать конфигурацию плагина
    default: op